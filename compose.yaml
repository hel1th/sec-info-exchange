services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
      API_READER_KEY: ${API_READER_KEY:?Set API_READER_KEY in .env}
      API_WRITER_KEY: ${API_WRITER_KEY:?Set API_WRITER_KEY in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-65536}
      DATABASE_URL: "host=db port=5432 user=${POSTGRES_USER:-threats} password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env} dbname=${POSTGRES_DB:-threats} sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threats}
      POSTGRES_USER: ${POSTGRES_USER:-threats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  tools:
    image: golang:1.27
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      BASE_URL: http://api:8080
      API_READER_KEY: ${API_READER_KEY:?Set API_READER_KEY in .env}
      API_WRITER_KEY: ${API_WRITER_KEY:?Set API_WRITER_KEY in .env}

  integration:
    extends: tools
    environment:
      TEST_DATABASE_URL: "host=db port=5432 user=${POSTGRES_USER:-threats} password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env} dbname=${POSTGRES_DB:-threats} sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    command: go test -count=1 -v ./internal/repository/postgres

  lint:
    image: golangci/golangci-lint:v2.13.1
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go_modules:/go/pkg/mod
      - lint_cache:/root/.cache
    command: golangci-lint run --config .golangci.yaml ./...

volumes:
  go_modules:
  go_build:
  lint_cache:
  postgres_data:
